serverFiles:
  alerting_rules.yml:
    groups:
      - name: lab6-19
        rules:
          - alert: AppDown
            expr: kube_deployment_status_replicas_available{namespace="lab6-19",deployment="lab6-19"} == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "lab6-19: бірде-бір Pod жұмыс істемейді"

          - alert: AppUnavailableReplicas
            expr: kube_deployment_status_replicas_unavailable{namespace="lab6-19",deployment="lab6-19"} > 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "lab6-19: дайын емес Pod бар"
